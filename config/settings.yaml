# =====================================================================
# Kripto Botu - main settings file
# Lines starting with "#" are comments (explanations). The bot ignores them.
# Change a value, save the file, restart the bot.
# =====================================================================

# --- Mode ------------------------------------------------------------
# Only READ_ONLY and PAPER_TRADING are allowed for now. No real orders are
# ever sent; LIVE_TRADING is rejected at startup.
trading_mode: PAPER_TRADING
market_type: SPOT
leverage: 1

# --- Currencies ------------------------------------------------------
display_currency: TRY
risk_currency: TRY
internal_valuation_currency: USD
primary_quote_currencies: [TRY, USDT]
supported_assets: [TRY, USDT, USD, BTC, ETH]

# --- Pairs -----------------------------------------------------------
# The bot trades the dollar pairs. The TL pairs are only watched;
# USDT/TRY also gives the dollar rate used to show everything in TL.
pairs:
  - BTC/USDT
  - ETH/USDT
  - BTC/TRY
  - ETH/TRY
  - USDT/TRY

# --- Paper account ---------------------------------------------------
# The 10,000 TL is changed into dollars (USDT) at the start, see paper.cash_currency.
starting_capital: 10000
starting_capital_currency: TRY

# --- Risk limits -----------------------------------------------------
# Making a limit STRICTER (smaller) applies at once. Making it LOOSER
# (bigger) only applies after you send /onayla in Telegram.
risk:
  max_concurrent_positions: 2
  max_daily_loss_pct: 3        # hit -> no new trades until midnight (Turkey time)
  max_weekly_loss_pct: 6       # hit -> no new trades until Monday
  max_total_drawdown_pct: 10   # hit -> emergency stop, needs "/devam ONAY"
  max_risk_per_trade_pct: 1    # loss at the stop price, as % of the account
  reset_utc_offset_hours: 3    # Turkey = UTC+3
  assumed_round_trip_cost_bps: 20  # fees + slippage added to each trade's risk
  warn_at_fraction: 0.7        # early warning at 70% of a loss limit

# --- Capital guard (ana para koruması) ----------------------------------
# The bot defends a floor just under the money put in: trade sizes are cut so
# that even if every open trade hits its stop, the account stays above it.
# If the account still touches the floor (e.g. a price gap), everything is sold
# and the bot stops until you send "/devam ONAY". Every gain raises the floor:
# half of the best profit so far is locked in. The floor cannot be exactly the
# starting money, because every buy and sell pays a fee.
capital_guard:
  enabled: true
  max_loss_from_start_pct: 2   # floor = starting capital - 2%
  lock_profit_pct: 50          # floor rises by half of the profit already booked or locked by stops
  gap_allowance_bps: 50        # sizing assumes a stop may fill 0.5% worse (sudden drops)
  pause_after_losses: 3        # 3 losing trades in a row ->
  pause_hours: 24              # ... no new trade for 24 hours

# --- Exchange --------------------------------------------------------
exchange:
  name: okx
  # Public market data needs no API key. If your account is on OKX TR
  # and the global address does not work for you, ask Claude for the
  # OKX TR address and put it here.
  rest_base_url: https://www.okx.com
  ws_public_url: wss://ws.okx.com:8443/ws/v5/public
  request_timeout_seconds: 10

# --- Market data -----------------------------------------------------
market_data:
  # websocket = live stream (fast). rest = ask every few seconds (fallback).
  mode: websocket
  rest_poll_interval_seconds: 3
  order_book_depth: 20
  order_book_refresh_seconds: 10
  # A price older than this is marked STALE.
  stale_after_seconds: 30

# --- FX (USD/TRY) ----------------------------------------------------
fx:
  # USDT/TRY on the exchange is used as the USD/TRY rate.
  source_pair: USDT/TRY
  # Spec rule: if FX is older than 5 minutes, no new positions.
  max_age_seconds: 300

# --- Liquidity thresholds for TRY pairs --------------------------------
# A pair below these values is not traded (TRY pairs can be thin).
liquidity:
  max_spread_bps: 30            # max gap between buy and sell price (30 = 0.30%)
  min_book_depth_try: 250000    # min order book value on each side, within depth_band_bps
  min_24h_volume_try: 5000000   # min traded value in the last 24 hours
  depth_band_bps: 50
  alert_after_seconds: 120      # warn only if a pair stays unfit this long
  # No buy while sellers clearly outweigh buyers near the price
  # (-1 = only sellers, 0 = balanced, +1 = only buyers).
  min_book_imbalance: -0.3

# --- Paper (practice) account ------------------------------------------
# Fake money only. Buys and sells are simulated against the real OKX order
# book (with fees), nothing is ever sent to the exchange.
paper:
  state_file: data/paper_state.json  # balances and open positions survive a restart
  fee_bps: 10              # fee per buy and per sell (10 = 0.10%)
  max_position_pct: 30     # one position uses at most 30% of the account (limits damage from a crash)
  check_every_seconds: 2   # how often stop-loss / target are checked
  # Idle money is kept in dollars (USDT): in the backtest (October 2026) TL
  # lost value against the dollar, and the dollar pairs did better.
  # TL money (the starting capital, an old TL trade) is changed into USDT
  # once at the live rate, paying the fee.
  cash_currency: USDT

# --- Strategy (Phase 4): trend breakout ---------------------------------
# Buys only when ALL are true at the close of a candle:
#  1) the big picture (daily candles) is in an uptrend,
#  2) the price is above its 4-hour average,
#  3) the price closes above the highest price of the last 20 candles,
#  4) the price moves enough (but not wildly).
# Every buy still needs the risk engine's OK. Paper money only.
# Days without a buy are normal: the rule waits for a clear trend.
# 4-hour candles + daily trend was the steadiest of the 3 rule sets in the
# backtest (October 2026). The first setting was 1-hour candles + 4-hour trend.
strategy:
  enabled: true
  pairs: [BTC/USDT, ETH/USDT]  # must be priced in paper.cash_currency
  bar_minutes: 240         # 4-hour candles (60 = 1 hour, 1440 = daily)
  trend_bar_minutes: 1440  # daily candles for the big-picture trend
  trend_ema_fast: 20
  trend_ema_slow: 50
  ema_period: 50
  breakout_bars: 20
  atr_period: 14           # ATR = average size of a candle (how much the price moves)
  stop_atr: 2.5            # first stop-loss = buy price - 2.5 x ATR
  min_atr_pct: 0.3
  max_atr_pct: 6
  history_bars: 1000       # candles loaded at start
  refresh_seconds: 60
  act_within_minutes: 10   # ignore signals from candles that closed longer ago

# --- Exit rules (separate from the buy rule) -----------------------------
# R = distance between the buy price and the first stop-loss.
exits:
  breakeven_at_r: 1.0        # price 1 R up -> stop moves to the buy price (+ costs)
  breakeven_buffer_bps: 20
  trail_atr: 3.0             # then the stop follows the best close at 3 x ATR (only up)
  stale_after_bars: 18       # sell if the trade has not moved up after 18 candles (3 days)
  max_hold_bars: 90          # sell every trade after 90 candles (15 days)
  exit_on_trend_break: true  # sell when the daily uptrend ends

# --- Backtest (test the strategy on past prices) --------------------------
# Start with GeriyeTest.bat (Windows) or GeriyeTest.command (Mac).
# The first 70% of the period is the "learning" part, the last 30% is
# "unseen" data that shows whether the rule still works.
backtest:
  days: 730
  in_sample_pct: 70
  slippage_bps: 10           # worse price on every buy and sell (0.10%), on top of the fee
  drawdown_pause_days: 7     # after an emergency stop: pause 7 days, then continue (0 = stop the test)
  compare_variants: true     # also test the other 2 fixed rule sets (1-hour and daily candles)
  # Every rule is also tested on these TL pairs (idle money kept in TL),
  # so you can see side by side whether dollars still do better. [] = off.
  compare_pairs: [BTC/TRY, ETH/TRY]
  cache_dir: data/candles
  report_file: data/backtest_report.txt

# --- Status output ---------------------------------------------------
status:
  print_every_seconds: 5
  # A JSON snapshot written here; the phone dashboard (Phase 5) reads it.
  status_file: data/status.json
  log_file: logs/bot.log
  events_file: data/events.jsonl      # every alert/halt/trade, one per line
  risk_state_file: data/risk_state.json  # halts survive a restart
  alert_grace_seconds: 60
  listing_check_minutes: 5            # re-check that pairs are still listed

# --- Telegram (bot name: Achilles) -------------------------------------
# The token and your chat id go in the .env file next to the program,
# never in this file.
telegram:
  enabled: true
  env_file: .env
  api_base_url: https://api.telegram.org
  poll_timeout_seconds: 25
  alert_cooldown_minutes: 30   # same warning at most every 30 min (KRİTİK and trades: always)
  error_cooldown_minutes: 5    # same system error at most every 5 min

# --- Jarvis link -----------------------------------------------------
# Jarvis can read status/report and do an emergency stop/resume.
# It can never place orders or change limits. Keys are created in .env.
jarvis:
  enabled: true
  host: 127.0.0.1   # only programs on this computer can connect
  port: 8765
  # summary = Jarvis only gets the end-of-day summary; all = every alert too.
  # The bot never waits for Jarvis: it runs the same when Jarvis is off.
  webhook_events: summary

# --- End-of-day summary ------------------------------------------------
# One short summary every evening: Telegram message + Jarvis + saved to a file.
# If the bot was off at that time, yesterday's summary is written at the next start.
daily_summary:
  enabled: true
  at: "23:55"       # Turkey time (keep the quotes)
  file: data/daily_summaries.jsonl

# Windows: do not let the computer go to sleep while the bot runs
# (the screen can still turn off). Use ArkaPlanda-Calistir.bat to run the
# bot hidden and start it automatically with Windows.
keep_awake: true

# --- Control Center (Phase 5) ------------------------------------------
# One screen with everything: balance, positions, trades, limits, health
# score, emergency stop. Opens in the browser; can be installed as an app
# on the computer and added to the phone's home screen. The key is created
# in .env (PANEL_KEY); Telegram /panel sends you the links.
panel:
  enabled: true
  port: 8770
  home_network: true    # true = phone on the same home Wi-Fi can open it
  open_on_start: true   # open the panel in the browser when the bot starts
