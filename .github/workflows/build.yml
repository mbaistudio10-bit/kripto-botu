name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: KriptoBotu-Windows.zip
          - os: macos-latest
            asset: KriptoBotu-Mac.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m pytest -q
      - run: pyinstaller --onefile --name KriptoBotu --paths src --collect-submodules cryptobot run_bot.py
      - name: Package
        shell: bash
        run: |
          mkdir -p out/KriptoBotu/config
          cp dist/KriptoBotu* out/KriptoBotu/
          cp config/settings.yaml out/KriptoBotu/config/
          cp KURULUM.md out/KriptoBotu/
          cd out && 7z a ../${{ matrix.asset }} KriptoBotu
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest assets/*.zip --repo "$GITHUB_REPOSITORY" \
            --title "KriptoBotu (en son sürüm)" --notes "İndirin, açın, KriptoBotu dosyasına çift tıklayın."
