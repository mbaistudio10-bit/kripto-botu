name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # A missing Mac runner must not hold back the Windows download.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: KriptoBotu-Windows.zip
          - os: macos-latest
            asset: KriptoBotu-Mac.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m pytest -q
      # A folder build (not --onefile): one-file programs unpack themselves at every start,
      # which antivirus programs often mistake for malware.
      - run: pyinstaller --onedir --noconfirm --name KriptoBotu --paths src --collect-submodules cryptobot run_bot.py
      - name: Package
        shell: bash
        run: |
          mkdir -p out/KriptoBotu/config
          cp -R dist/KriptoBotu/. out/KriptoBotu/
          cp config/settings.yaml out/KriptoBotu/config/
          cp KURULUM.md out/KriptoBotu/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp packaging/GeriyeTest.bat packaging/ArkaPlanda-Calistir.bat packaging/ArkaPlan-Durdur.bat out/KriptoBotu/
          else
            cp packaging/GeriyeTest.command out/KriptoBotu/ && chmod +x out/KriptoBotu/GeriyeTest.command
          fi
          cd out && 7z a ../${{ matrix.asset }} KriptoBotu
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    # Publish whatever was built; a zip whose build failed keeps its previous version.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls assets/KriptoBotu-Windows.zip  # the Windows build must have passed
          [ -f assets/KriptoBotu-Mac.zip ] || \
            gh release download latest --repo "$GITHUB_REPOSITORY" -p KriptoBotu-Mac.zip -D assets || true
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest assets/*.zip --repo "$GITHUB_REPOSITORY" \
            --title "KriptoBotu (en son sürüm)" --notes "İndirin, açın, KriptoBotu dosyasına çift tıklayın."
