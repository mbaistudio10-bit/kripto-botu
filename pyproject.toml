[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptobot"
version = "0.7.3"
description = "Multi-currency crypto trading bot (Phase 4: trend strategy + backtest, paper trading)"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9,<4",
    "pydantic>=2.6,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
